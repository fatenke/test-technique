services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - app-network

  backend:
    image: ghcr.io/fatenke/notes-backend:latest
    container_name: backend
    restart: always

    depends_on:
      - mysql

    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}

    ports:
      - "8080:8080"

    networks:
      - app-network

  frontend:
    image: ghcr.io/fatenke/notes-frontend:latest
    container_name: frontend
    restart: always

    depends_on:
      - backend

    ports:
      - "5173:80"

    networks:
      - app-network

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: always

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    ports:
      - "9090:9090"

    depends_on:
      - backend

    networks:
      - app-network

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: always

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge